[project]
name = "creditpath"
version = "0.1.0"
description = "Loan-readiness and repayment-timing coach"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8"]
