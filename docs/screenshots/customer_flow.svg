<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" style="background:#F4F4F6; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Frame Canvas -->
  <rect x="180" y="20" width="440" height="960" rx="36" fill="url(#bgGrad)" stroke="#E8E8EC" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Notch / Phone speaker -->
  <rect x="350" y="32" width="100" height="6" rx="3" fill="#D1D1D6"/>

  <!-- Top App Bar -->
  <g transform="translate(205, 60)">
    <circle cx="20" cy="20" r="16" fill="#F4F4F6"/>
    <text x="14" y="25" font-size="16" fill="#1A1A1F">👤</text>
    <text x="50" y="26" font-size="17" font-weight="700" fill="#1A1A1F">CreditPath</text>
    <rect x="310" y="8" width="70" height="26" rx="13" fill="#107C41" fill-opacity="0.1"/>
    <text x="326" y="25" font-size="12" font-weight="600" fill="#107C41">বাংলা / EN</text>
  </g>

  <!-- Status Card (Ready) -->
  <g transform="translate(205, 120)">
    <rect width="390" height="180" rx="20" fill="#ffffff" stroke="#E8E8EC" filter="url(#shadow)"/>
    <rect x="20" y="20" width="80" height="28" rx="14" fill="#EAF5EE" stroke="#C3E4CD"/>
    <text x="36" y="39" font-size="13" font-weight="700" fill="#107C41">✓ Ready</text>
    
    <text x="20" y="80" font-size="18" font-weight="700" fill="#1A1A1F">You are in a healthy spot for a loan</text>
    <text x="20" y="105" font-size="13" fill="#6B6B76">All 3 financial health checks have passed this month.</text>
    
    <!-- 3 Checks row -->
    <rect x="20" y="130" width="105" height="32" rx="10" fill="#F4F9F5"/>
    <text x="30" y="151" font-size="11" font-weight="600" fill="#107C41">✓ Active 6m</text>

    <rect x="135" y="130" width="115" height="32" rx="10" fill="#F4F9F5"/>
    <text x="145" y="151" font-size="11" font-weight="600" fill="#107C41">✓ Steady Inflow</text>

    <rect x="260" y="130" width="110" height="32" rx="10" fill="#F4F9F5"/>
    <text x="270" y="151" font-size="11" font-weight="600" fill="#107C41">✓ Buffer & Bills</text>
  </g>

  <!-- Safe Range Card -->
  <g transform="translate(205, 320)">
    <rect width="390" height="230" rx="20" fill="#ffffff" stroke="#E8E8EC" filter="url(#shadow)"/>
    <text x="24" y="38" font-size="16" font-weight="700" fill="#1A1A1F">Recommended Safe Repayment</text>
    <text x="24" y="60" font-size="12" fill="#6B6B76">Based on your cash flow surplus and 30% stress buffer</text>

    <rect x="24" y="85" width="342" height="70" rx="14" fill="#F8F9FA" stroke="#F1F1F4"/>
    <text x="44" y="112" font-size="12" fill="#6B6B76">Monthly Safe Cap</text>
    <text x="44" y="138" font-size="22" font-weight="800" fill="#107C41">৳ 2,400 – ৳ 3,200</text>
    <text x="250" y="128" font-size="11" fill="#6B6B76">per month</text>

    <!-- Stressed range note -->
    <rect x="24" y="170" width="342" height="42" rx="10" fill="#FFF9E6" stroke="#FFE79A"/>
    <text x="36" y="196" font-size="11" font-weight="600" fill="#945B00">⚠ Stress Tested: Holds safe during slow festival/off-season</text>
  </g>

  <!-- Interactive Simulator Card -->
  <g transform="translate(205, 570)">
    <rect width="390" height="270" rx="20" fill="#ffffff" stroke="#E8E8EC" filter="url(#shadow)"/>
    <text x="24" y="38" font-size="16" font-weight="700" fill="#1A1A1F">Fit Calculator</text>

    <text x="24" y="75" font-size="13" font-weight="600" fill="#6B6B76">Loan Amount: ৳ 15,000</text>
    <!-- Slider mock -->
    <rect x="24" y="90" width="342" height="8" rx="4" fill="#E8E8EC"/>
    <rect x="24" y="90" width="160" height="8" rx="4" fill="#0066FF"/>
    <circle cx="184" cy="94" r="12" fill="#0066FF" filter="url(#shadow)"/>

    <text x="24" y="135" font-size="13" font-weight="600" fill="#6B6B76">Tenor: 6 Months</text>
    <rect x="24" y="150" width="342" height="8" rx="4" fill="#E8E8EC"/>
    <rect x="24" y="150" width="100" height="8" rx="4" fill="#0066FF"/>
    <circle cx="124" cy="154" r="12" fill="#0066FF" filter="url(#shadow)"/>

    <rect x="24" y="185" width="342" height="64" rx="14" fill="#EAF5EE" stroke="#C3E4CD"/>
    <text x="40" y="212" font-size="13" font-weight="700" fill="#107C41">✓ Comfortable Fit</text>
    <text x="40" y="234" font-size="12" fill="#2E7D32">Monthly installment ৳ 2,680 fits inside your safe buffer.</text>
  </g>

  <!-- Bottom Navigation -->
  <g transform="translate(180, 915)">
    <rect width="440" height="65" rx="0" fill="#ffffff" stroke="#E8E8EC"/>
    <text x="60" y="38" font-size="12" font-weight="700" fill="#0066FF">🏠 Home</text>
    <text x="160" y="38" font-size="12" fill="#6B6B76">🧮 Check</text>
    <text x="260" y="38" font-size="12" fill="#6B6B76">📅 Calendar</text>
    <text x="360" y="38" font-size="12" fill="#6B6B76">👤 Me</text>
  </g>
</svg>
