name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: creditpath
          POSTGRES_PASSWORD: creditpath_test_password
          POSTGRES_DB: creditpath_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          uv pip install --system -r pyproject.toml --extra dev fastparquet sqlalchemy psycopg2-binary "scikit-learn==1.6.1"

      - name: Generate Synthetic Dataset
        working-directory: ./backend
        run: |
          python -c "from app.data.generator import generate_dataset; from app.data.loader import save_data; d = generate_dataset(n_customers=1000); save_data(d)"

      - name: Run Pytest Suite against PostgreSQL
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://creditpath:creditpath_test_password@localhost:5432/creditpath_test_db
          ADMIN_API_KEY: test-admin-secret-key-2026
          ADMIN_TOKEN: test-admin-jwt-token-2026
          PYTHONPATH: .
        run: |
          pytest tests/ -v

  frontend-tests:
    name: Frontend Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

  docker-build:
    name: Build & Verify Docker Images
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: creditpath-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: creditpath-frontend:latest
