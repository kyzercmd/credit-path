services:
  postgres:
    image: postgres:16-alpine
    container_name: creditpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: creditpath
      POSTGRES_PASSWORD: creditpath_secure_password
      POSTGRES_DB: creditpath_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditpath -d creditpath_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creditpath-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://creditpath:creditpath_secure_password@postgres:5432/creditpath_db
      ADMIN_API_KEY: ${ADMIN_API_KEY:-creditpath-admin-secret-key-2026}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-creditpath-admin-jwt-token-2026}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creditpath-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_ADMIN_API_KEY: ${ADMIN_API_KEY:-creditpath-admin-secret-key-2026}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
